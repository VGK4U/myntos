workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      java: 21
      node: 20
      vars:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.npm
        - mobile/node_modules
        - shared/journey-core/node_modules
        - mobile/android/.gradle
        - mobile/android/build
        - mobile/android/app/build
    scripts:
      - name: Build journey-core
        script: |
          cd shared/journey-core
          npm install --prefer-offline --no-audit --no-fund
          npm run build
      - name: Install mobile dependencies
        script: |
          cd mobile
          npm ci --prefer-offline --no-audit --no-fund
      - name: Build web assets
        script: |
          cd mobile
          VITE_BASE_URL='/' npm run build
      - name: Sync Capacitor
        script: |
          cd mobile
          npx cap sync android --inline
      - name: Set Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > mobile/android/local.properties
      - name: Build Android Release AAB
        script: |
          set -e
          cd mobile/android
          chmod +x gradlew
          echo "=== Starting Gradle Release Bundle Build ==="
          ./gradlew bundleRelease --stacktrace --info || ./gradlew assembleRelease --stacktrace --info
          echo "=== Build Complete, Checking Output ==="
          find app/build/outputs/ -name "*.aab" -o -name "*.apk" -type f 2>/dev/null || true
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/apk/release/*.apk
      - mobile/android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - mentor2byz@gmail.com
        notify:
          success: true
          failure: true
