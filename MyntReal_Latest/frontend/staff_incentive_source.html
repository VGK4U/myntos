<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incentive Source Verification</title>
<link rel="stylesheet" href="/public/css/staff-portal.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { background:#f8fafc; font-family:'Inter',sans-serif; margin:0; padding:0; }
  .page-wrap { width:99%; max-width:1600px; margin:0 auto; padding:12px 10px 24px; }
  .page-header { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:12px 18px; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .page-header-icon { width:38px; height:38px; border-radius:6px; background:#e0e7ff; display:flex; align-items:center; justify-content:center; font-size:1rem; color:#4f46e5; flex-shrink:0; }
  .page-header-info { flex:1; }
  .page-header h1 { margin:0 0 2px; font-size:0.95rem; font-weight:700; color:#1e293b; }
  .page-header .meta { font-size:0.76rem; color:#6b7280; display:flex; flex-wrap:wrap; gap:8px; }
  .meta-chip { background:#f1f5f9; border-radius:4px; padding:1px 6px; font-weight:500; }
  .meta-chip.purple { background:#ede9fe; color:#6d28d9; }
  .meta-chip.blue { background:#dbeafe; color:#1d4ed8; }
  .meta-chip.green { background:#dcfce7; color:#15803d; }
  .card { background:#fff; border:1px solid #e5e7eb; border-radius:8px; overflow:hidden; }
  .card-body { overflow-x:auto; padding:0; }
  table { width:100%; border-collapse:collapse; font-size:0.75rem; table-layout:auto; }
  thead th { background:#f8fafc; padding:6px 8px; text-align:left; font-weight:700; color:#475569; font-size:0.68rem; text-transform:uppercase; letter-spacing:.03em; border-bottom:2px solid #e2e8f0; white-space:nowrap; }
  tbody tr { border-bottom:1px solid #f1f5f9; transition:background .12s; }
  tbody tr:hover { background:#fafafa; }
  td { padding:6px 8px; vertical-align:middle; white-space:nowrap; }
  .badge { display:inline-block; padding:1px 5px; border-radius:3px; font-size:0.65rem; font-weight:600; }
  .badge-self { background:#fef3c7; color:#92400e; }
  .badge-co { background:#e0e7ff; color:#3730a3; }
  .badge-crm { background:#f0fdf4; color:#15803d; padding:1px 4px; }
  .badge-direct { background:#fdf4ff; color:#7e22ce; padding:1px 4px; }
  .name-cell { font-weight:600; color:#1e293b; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .phone-cell { color:#6b7280; font-size:0.72rem; }
  .source-cell { color:#6b7280; font-size:0.72rem; max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .role-cell { font-size:0.72rem; font-weight:600; }
  .amount-cell { text-align:right; font-weight:600; }
  .date-cell { color:#6b7280; font-size:0.72rem; white-space:nowrap; }
  .view-link { color:#7c3aed; font-size:0.78rem; transition:color 0.12s; }
  .view-link:hover { color:#4f46e5; }
  .empty-state { text-align:center; padding:50px 20px; color:#9ca3af; }
  .empty-state i { font-size:2rem; margin-bottom:10px; display:block; }
  .loading-state { text-align:center; padding:50px 20px; color:#6b7280; }
  .error-state { text-align:center; padding:40px 20px; color:#ef4444; }
  .back-btn { display:inline-flex; align-items:center; gap:6px; color:#475569; font-size:0.8rem; text-decoration:none; border:1px solid #cbd5e1; border-radius:6px; padding:5px 10px; background:#fff; cursor:pointer; margin-bottom:12px; transition:background .15s; }
  .back-btn:hover { background:#f1f5f9; }
  .sno { color:#9ca3af; font-size:0.7rem; font-weight:500; }
  .summary-bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .sum-card { background:#fff; border:1px solid #e5e7eb; border-radius:6px; padding:8px 12px; min-width:100px; }
  .sum-card .val { font-size:1.1rem; font-weight:700; color:#1e293b; }
  .sum-card .lbl { font-size:0.68rem; color:#6b7280; margin-top:1px; }
</style>
</head>
<body>

<div class="page-wrap">
  <button class="back-btn" onclick="window.close()"><i class="fa fa-times"></i> Close Tab</button>

  <div class="page-header">
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="page-header-icon"><i class="fa fa-list-check"></i></div>
      <div class="page-header-info">
        <h1 id="pg-title">Loading source data…</h1>
        <div class="meta" id="pg-meta"></div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <label for="cat-filter" style="font-size:0.78rem; font-weight:700; color:#374151;">Category:</label>
      <select id="cat-filter" onchange="onCategoryChange()" style="padding:4px 10px; border:1px solid #cbd5e1; border-radius:6px; font-size:0.8rem; font-weight:600; color:#374151; background:#fff; outline:none; cursor:pointer; min-width:160px;">
        <option value="all">All Categories</option>
        <option value="training">ETC Students</option>
        <option value="solar">Solar</option>
        <option value="ev_b2c">EV B2C</option>
        <option value="ev_b2b_new">EV B2B (New)</option>
        <option value="ev_b2b_existing">EV B2B (Existing)</option>
        <option value="insurance">Insurance</option>
        <option value="real_estate">Real Estate</option>
        <option value="service_spares">Service Spares</option>
        <option value="service_revenue">Service Revenue</option>
      </select>
    </div>
  </div>

  <div class="summary-bar" id="sum-bar" style="display:none;"></div>

  <div class="card">
    <div class="card-body">
      <div id="table-wrap">
        <div class="loading-state"><i class="fa fa-spinner fa-spin fa-2x mb-2"></i><br>Loading records…</div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '/api/v1';
const MONTHS = ['','January','February','March','April','May','June','July','August','September','October','November','December'];
const CAT_LABEL = {
  training:'ETC Students', solar:'Solar', ev_b2c:'EV B2C', ev_b2b:'EV B2B',
  ev_b2b_new:'EV B2B (New)', ev_b2b_existing:'EV B2B (Existing)',
  insurance:'Insurance', real_estate:'Real Estate',
  service_spares:'Service Spares', service_revenue:'Service Revenue'
};

let loggedInUserCode = '';
let loggedInEmpId = '';
let loggedInEmpName = '';

function authHdr() {
  const t = localStorage.getItem('staff_token') || sessionStorage.getItem('staff_token') || '';
  return { 'Content-Type':'application/json', 'Authorization': t ? 'Bearer ' + t : '' };
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtNum(n) {
  const x = parseFloat(n);
  if (isNaN(x)) return '0';
  return x.toLocaleString('en-IN', { maximumFractionDigits: 0 });
}

async function loadData() {
  const params = new URLSearchParams(window.location.search);
  let empId      = params.get('employee_id');
  let slug       = params.get('category_slug') || 'all';
  let monthParam = params.get('month');
  let yearParam  = params.get('year');
  const compId   = parseInt(params.get('company_id')) || 0;
  let empName    = decodeURIComponent(params.get('emp_name') || '');

  const now = new Date();
  if (!yearParam) yearParam = String(now.getFullYear());
  if (!monthParam) monthParam = String(now.getMonth() + 1);

  // Fetch logged in user info if empId is missing
  if (!empId || empId === 'null' || empId === 'undefined' || !loggedInEmpId) {
    try {
      const meRes = await fetch(`${API}/staff/auth/me`, { headers: authHdr() });
      if (meRes.ok) {
        const meData = await meRes.json();
        const emp = meData?.employee || {};
        loggedInUserCode = emp.emp_code || '';
        loggedInEmpId = String(emp.id || '');
        loggedInEmpName = emp.full_name || emp.emp_code || '';
        if (!empId || empId === 'null' || empId === 'undefined') empId = loggedInEmpId;
        if (!empName) empName = loggedInEmpName;
      }
    } catch(e) { console.warn('[AuthMe]', e); }
  }

  const catSelect = document.getElementById('cat-filter');
  if (catSelect) catSelect.value = slug;

  const catLabel = slug === 'all' ? 'All Categories' : (CAT_LABEL[slug] || decodeURIComponent(params.get('cat_label') || slug || ''));
  const monthName = MONTHS[parseInt(monthParam)] || '';

  document.title = `Source · ${catLabel} · ${empName || 'Staff'}`;
  document.getElementById('pg-title').textContent = `Source Verification — ${catLabel}`;
  document.getElementById('pg-meta').innerHTML = `
    <span class="meta-chip purple">${esc(empName || 'Staff Member')}</span>
    <span class="meta-chip blue">${esc(monthName)} ${yearParam}</span>
    ${compId ? `<span class="meta-chip">Company ${compId}</span>` : '<span class="meta-chip">All Companies</span>'}
  `;

  if (!empId || empId === 'null' || empId === 'undefined') {
    document.getElementById('table-wrap').innerHTML = '<div class="error-state"><i class="fa fa-exclamation-circle fa-2x mb-2"></i><br>User profile not found. Please log in again.</div>';
    return;
  }

  try {
    let url = `${API}/staff/incentive-achievements/drilldown?month=${encodeURIComponent(monthParam)}&year=${yearParam}&employee_id=${empId}&category_slug=${slug}`;
    if (compId) url += `&company_id=${compId}`;
    const r = await fetch(url, { headers: authHdr() });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.detail || `HTTP ${r.status}`);
    }
    const d = await r.json();
    if (!d.success) throw new Error(d.message || 'Failed to load source records');
    renderTable(d);
  } catch(e) {
    document.getElementById('table-wrap').innerHTML = `<div class="error-state"><i class="fa fa-exclamation-circle fa-2x mb-2"></i><br>${esc(e.message)}</div>`;
  }
}

function onCategoryChange() {
  const catVal = document.getElementById('cat-filter').value;
  const params = new URLSearchParams(window.location.search);
  params.set('category_slug', catVal);
  const newUrl = window.location.pathname + '?' + params.toString();
  window.history.replaceState({}, '', newUrl);
  loadData();
}

function renderTable(d) {
  const rows = d.data || [];
  const urlP   = new URLSearchParams(window.location.search);
  const slug   = urlP.get('category_slug') || 'all';
  const month  = parseInt(urlP.get('month'));
  const year   = parseInt(urlP.get('year'));
  const empId  = urlP.get('employee_id') || '';
  const empName = decodeURIComponent(urlP.get('emp_name') || '');

  const isPrivileged = true;

  const incentiveTotal = d.incentive_total != null ? d.incentive_total : rows.reduce((s,r) => s+(r.incentive_count||1), 0);
  const selfCount = rows.filter(r => r.lead_type === 'Self').reduce((s,r) => s+(r.incentive_count||1), 0);
  const coCount   = rows.filter(r => r.lead_type === 'Company').reduce((s,r) => s+(r.incentive_count||1), 0);
  
  const totalDV   = rows.reduce((s, r) => s + (r.deal_value||0), 0);
  const totalDVR  = rows.reduce((s, r) => s + (r.deal_value_received||0), 0);
  const totalCV   = rows.reduce((s, r) => s + (r.confirmed_value||0), 0);
  const totalInc  = rows.reduce((s, r) => s + (r.incentive_amount||0), 0);

  const sumBar = document.getElementById('sum-bar');
  sumBar.style.display = 'flex';
  sumBar.innerHTML = `
    <div class="sum-card"><div class="val">${incentiveTotal}</div><div class="lbl">Incentive Count</div></div>
    <div class="sum-card"><div class="val">${rows.length}</div><div class="lbl">Unique Records</div></div>
    <div class="sum-card"><div class="val">${coCount}</div><div class="lbl">Company Leads</div></div>
    <div class="sum-card"><div class="val">${selfCount}</div><div class="lbl">Self Leads</div></div>
    ${isPrivileged && totalDV > 0 ? `<div class="sum-card"><div class="val" style="color:#2563eb;">₹${fmtNum(totalDV)}</div><div class="lbl">Total Deal Value</div></div>` : ''}
    ${isPrivileged && totalDVR > 0 ? `<div class="sum-card"><div class="val" style="color:#0d9488;">₹${fmtNum(totalDVR)}</div><div class="lbl">Total Received</div></div>` : ''}
    ${isPrivileged && totalCV > 0 ? `<div class="sum-card"><div class="val" style="color:#d97706;">₹${fmtNum(totalCV)}</div><div class="lbl">Total Confirmed</div></div>` : ''}
    ${totalInc > 0 ? `<div class="sum-card"><div class="val" style="color:#7c3aed;">₹${fmtNum(totalInc)}</div><div class="lbl">Total Incentive</div></div>` : ''}
  `;

  if (!rows.length) {
    document.getElementById('table-wrap').innerHTML = '<div class="empty-state"><i class="fa fa-inbox"></i>No source records found for this period.</div>';
    return;
  }

  const tableRows = rows.map((r, i) => {
    const typeBadge = r.lead_type === 'Self'
      ? '<span class="badge badge-self">Self</span>'
      : '<span class="badge badge-co">Co</span>';
    const recBadge = r.record_type === 'crm_lead'
      ? '<span class="badge badge-crm" title="CRM Lead">CRM</span>'
      : (r.record_type === 'service_ticket'
         ? '<span class="badge badge-co" title="Service Ticket">TKT</span>'
         : '<span class="badge badge-direct" title="ETC Direct Student">ETC</span>');
      
    const rolesMapped = (r.roles||[]).map(role => {
      if (role === 'Telecaller') return '<span style="color:#0891b2;" title="Telecaller">TC</span>';
      if (role === 'Field Staff') return '<span style="color:#059669;" title="Field Staff">FS</span>';
      if (role === 'Handler') return '<span style="color:#b45309;" title="Handler">HD</span>';
      return esc(role);
    }).join(', ') || '—';

    const catShort = (r.category||'—')
      .replace('ETC Training', 'ETC')
      .replace('EV B2B (New)', 'B2B(N)')
      .replace('EV B2B (Existing)', 'B2B(E)');

    const dv     = r.deal_value > 0 ? `₹${fmtNum(r.deal_value)}` : '—';
    const dvr    = r.deal_value_received > 0 ? `₹${fmtNum(r.deal_value_received)}` : '—';
    const cv     = r.confirmed_value > 0 ? `₹${fmtNum(r.confirmed_value)}` : '—';
    const incPct = r.incentive_pct || '—';
    const incAmt = r.incentive_amount != null ? `₹${fmtNum(r.incentive_amount)}` : '—';
    
    let date = '—';
    if (r.completion_date) {
      const parts = r.completion_date.slice(0,10).split('-');
      if (parts.length === 3) {
        date = `${parts[2]}/${parts[1]}/${parts[0].slice(2)}`;
      }
    }

    const cnt    = (r.incentive_count||1);
    const cntBadge = cnt > 1
      ? ` <span title="Counts ${cnt}×" style="background:#fef3c7;color:#92400e;font-size:0.62rem;padding:0px 3px;border-radius:2px;font-weight:700;">×${cnt}</span>`
      : '';
      
    const leadSlug = r.category_slug || slug;
    const crmUrl = `/staff/leads?inc_month=${month}&inc_year=${year}&inc_employee_id=${empId}&inc_emp_name=${encodeURIComponent(empName)}`;
    
    const link   = r.record_type === 'crm_lead'
      ? `<a class="view-link" href="${crmUrl}" target="_blank" title="View in CRM"><i class="fa fa-external-link-alt"></i></a>`
      : (r.record_type === 'service_ticket'
         ? `<a class="view-link" href="/staff/progress" target="_blank" title="View Tickets"><i class="fa fa-external-link-alt"></i></a>`
         : '—');
      
    return `<tr>
      <td class="sno">${i+1}</td>
      <td><div class="name-cell" title="${esc(r.name||'')}">${esc(r.name||'—')}${cntBadge}</div></td>
      <td class="phone-cell">${esc(r.phone||'—')}</td>
      <td style="font-weight:600;color:#475569;">${esc(catShort)}</td>
      <td>${typeBadge}</td>
      <td class="role-cell">${rolesMapped}</td>
      <td class="source-cell" title="${esc(r.source||'')}">${esc(r.source||'—')}</td>
      ${isPrivileged ? `
        <td class="amount-cell" style="color:#2563eb;">${dv}</td>
        <td class="amount-cell" style="color:#0d9488;">${dvr}</td>
        <td class="amount-cell" style="color:#d97706;font-weight:700;">${cv}</td>
        <td style="text-align:center;font-weight:700;color:#475569;">${incPct}</td>
      ` : ''}
      <td class="amount-cell" style="color:#7c3aed;font-weight:700;">${incAmt}</td>
      <td class="date-cell">${date}</td>
      <td>${recBadge}</td>
      <td style="text-align:center;">${link}</td>
    </tr>`;
  }).join('');

  document.getElementById('table-wrap').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Cat</th>
          <th>Type</th>
          <th>Role</th>
          <th>Source</th>
          ${isPrivileged ? `
            <th style="text-align:right;">Deal Value</th>
            <th style="text-align:right;">Received</th>
            <th style="text-align:right;">Confirmed</th>
            <th style="text-align:center;">Rate</th>
          ` : ''}
          <th style="text-align:right;">Incentive</th>
          <th>Date</th>
          <th>Rec</th>
          <th style="text-align:center;">Link</th>
        </tr>
      </thead>
      <tbody>${tableRows}</tbody>
    </table>
  `;
}

if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', loadData);
} else {
  loadData();
}
</script>
</body>
</html>
