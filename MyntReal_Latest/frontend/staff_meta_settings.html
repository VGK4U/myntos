<!DOCTYPE html>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f3f4f6; min-height: 100vh; }
        .main-content { margin-left: 0; transition: margin-left 0.3s; }

        .content-area { padding: 20px 24px; }
        .panel-card { background: white; border-radius: 12px; border: 1px solid #e5e7eb; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 20px; overflow: hidden; }
        .panel-head { padding: 16px 20px; border-bottom: 1px solid #e5e7eb; background: #fafafa; display: flex; align-items: center; justify-content: space-between; }

<script src="/staff_sidebar.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
    if (typeof StaffHeader !== 'undefined') StaffHeader.inject('Meta Settings & OAuth', 'fas fa-cog');

});

</html>
